services:
  nginx:
    image: nginx:alpine
    build:
      context: nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/server.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/dev.conf:/etc/nginx/conf.d/dev.conf
    depends_on:
      laravel:
        condition: service_started
      dev_panel:
        condition: service_started

  dev_panel:
    image: nginx:alpine
    volumes:
      - ./dev/public:/usr/share/nginx/html:ro

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www/html
      - pgcontent:/var/www/html/storage
    depends_on:
      postgresql:
        condition: service_healthy
    command: sh -c "php artisan migrate:fresh && php artisan db:seed && php-fpm"

  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_ROOT_PASSWORD: "uireh34t34"
      POSTGRES_DB: vblog
      POSTGRES_USER: vblog_adm
      POSTGRES_PASSWORD: "uireh34t34"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vblog_adm -d vblog"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  pgcontent: