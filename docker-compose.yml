services:
  nginx:
    image: vblog-nginx:local
    build:
      context: nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - label:disable
    volumes:
      - .:/var/www/html
      - build_assets:/var/www/html/public/build
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/server.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/dev.conf:/etc/nginx/conf.d/dev.conf
    networks:
      - vblog
    depends_on:
      laravel:
        condition: service_started
      dev_panel:
        condition: service_started

  dev_panel:
    image: nginx:alpine
    security_opt:
      - label:disable
    volumes:
      - ./dev/public:/usr/share/nginx/html:ro
      - ./dev/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - vblog

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    security_opt:
      - label:disable
    volumes:
      - .:/var/www/html
      - vendor_deps:/var/www/html/vendor
      - build_assets:/var/www/html/public/build
      - pgcontent:/var/www/html/storage
    networks:
      - vblog
    depends_on:
      postgresql:
        condition: service_healthy
    command: sh -c "chmod 777 /var/www/html/public/avatars || true && rm -f bootstrap/cache/*.php && php artisan migrate:fresh && php artisan db:seed && php-fpm"

  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_ROOT_PASSWORD: "uireh34t34"
      POSTGRES_DB: vblog
      POSTGRES_USER: vblog_adm
      POSTGRES_PASSWORD: "uireh34t34"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - vblog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vblog_adm -d vblog"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  vblog:
    driver: bridge

volumes:
  vendor_deps:
  build_assets:
  pgdata:
  pgcontent:
