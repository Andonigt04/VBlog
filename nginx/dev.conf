server {
    listen 80;
    server_name dev.vblog.local;

    location / {
        resolver       127.0.0.11 valid=5s;
        set            $upstream http://dev_panel:80;
        proxy_pass     $upstream;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
